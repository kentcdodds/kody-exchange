name: ✅ Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: 🧹 Validate
    timeout-minutes: 10
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install
        run: npm ci

      - name: ✅ Validate
        run: npm run validate
