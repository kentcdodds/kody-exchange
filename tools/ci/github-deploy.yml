name: 🚀 Deploy (production)

on:
  workflow_run:
    workflows:
      - '✅ Validate'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to production
    timeout-minutes: 12
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    environment:
      name: production
      url: https://kody.exchange
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install
        run: npm ci

      - name: 🔐 Sync Worker secrets from GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: >
          node tools/ci/sync-worker-secrets.ts --config wrangler.jsonc
          --set-from-env COOKIE_SECRET
          --set-from-env-optional GITHUB_CLIENT_ID
          --set-from-env-optional GITHUB_CLIENT_SECRET
          --set-from-env-optional STRIPE_SECRET_KEY
          --set-from-env-optional STRIPE_WEBHOOK_SECRET

      - name: 🗄️ Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kody-exchange --remote --config wrangler.jsonc

      - name: ☁️ Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" | tee deploy.log

      - name: 🩺 Healthcheck
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          HEALTHCHECK_URL="https://kody.exchange/health"
          attempts=20
          delay_seconds=3
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts $HEALTHCHECK_URL"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > health.json && \
              node -e "const json = JSON.parse(require('node:fs').readFileSync('health.json','utf8')); if (json?.ok !== true) process.exit(1); if (json?.commit !== process.env.EXPECTED_COMMIT_SHA) { console.error(json); process.exit(1) } console.log(json)"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done
          echo "Healthcheck failed" >&2
          cat health.json >&2 || true
          exit 1
